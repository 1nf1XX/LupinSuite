name: Build Swift App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      # Используем обновленный action, чтобы убрать предупреждение про Node.js
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check Swift Version
        run: swift --version

      - name: Compile check
        run: |
          # Проверяем, что компилятор видит файл
          echo "Checking main.swift..."
          ls -la
