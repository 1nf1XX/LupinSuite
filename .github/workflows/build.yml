name: Build Unsigned IPA from Swift

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Чекаут кода
        uses: actions/checkout@v4

      - name: Компиляция Swift-файла
        run: |
          # Ищем путь к iOS SDK на сервере GitHub
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Компилируем main.swift в бинарник LupinSuite под архитектуру ARM64 (iPhone)
          swiftc main.swift -o LupinSuite \
            -target arm64-apple-ios15.0 \
            -sdk $SDK_PATH \
            -O

      - name: Сборка структуры .app и Info.plist
        run: |
          # Создаем нужные папки
          mkdir -p Payload/LupinSuite.app
          
          # Переносим скомпилированный бинарник в папку приложения
          mv LupinSuite Payload/LupinSuite.app/
          
          # Копируем иконку
          cp AppIcon.png Payload/LupinSuite.app/
          
          # Генерируем минимальный Info.plist прямо из терминала
          cat <<EOF > Payload/LupinSuite.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>LupinSuite</string>
              <key>CFBundleIdentifier</key>
              <string>com.1nf1xx.lupinsuite</string>
              <key>CFBundleName</key>
              <string>LupinSuite</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.png</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

      - name: Упаковка в IPA
        run: |
          zip -qr LupinSuite.ipa Payload/

      - name: Выгрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: LupinSuite-Unsigned
          path: LupinSuite.ipa
