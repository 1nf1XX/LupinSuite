name: Build Unsigned IPA from Swift

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Чекаут кода
        uses: actions/checkout@v4

      - name: Компиляция Swift-файла
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Компилируем Swift код с поддержкой SwiftUI/UIKit фреймворков
          swiftc main.swift -o LupinSuite \
            -target arm64-apple-ios15.0 \
            -sdk $SDK_PATH \
            -parse-as-library \
            -Xlinker -rpath -Xlinker /System/Library/Frameworks \
            -O || {
              echo "Попытка прямой компиляции без parse-as-library..."
              swiftc main.swift -o LupinSuite -target arm64-apple-ios15.0 -sdk $SDK_PATH -O
            }

      - name: Сборка структуры .app и Info.plist
        run: |
          mkdir -p Payload/LupinSuite.app
          mv LupinSuite Payload/LupinSuite.app/
          
          if [ -f AppIcon.png ]; then
            cp AppIcon.png Payload/LupinSuite.app/
          fi
          
          cat <<EOF > Payload/LupinSuite.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>LupinSuite</string>
              <key>CFBundleIdentifier</key>
              <string>com.1nf1xx.lupinsuite</string>
              <key>CFBundleName</key>
              <string>LupinSuite</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.png</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

      - name: Упаковка в IPA
        run: |
          zip -qr LupinSuite.ipa Payload/

      - name: Выгрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: LupinSuite-Unsigned
          path: LupinSuite.ipa
